[package]
name = "vibecanvas-studio"
version = "0.1.0"
description = "VibeCanvas Studio – 3D HTML-in-Canvas Studio"
authors = ["VibeCanvas Team"]
license = "MIT"
edition = "2021"

[lib]
name = "vibecanvas_studio_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = [] }
tauri-plugin-fs  = "2"
tauri-plugin-dialog = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
